<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="360" viewBox="0 0 1200 360"
     role="img" aria-labelledby="title desc">
  <title id="title">深度调研 — 输入一个主题，输出结构化中文调研报告</title>
  <desc id="desc">多源检索 → 热度排名 → 作者深挖 → 需求提炼 → 功能分类 → 复刻 / 超越方案。</desc>

  <defs>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    </style>
  </defs>

  <rect width="1200" height="360" rx="14" fill="#F0FDF9"/>
  <rect x="1" y="1" width="1198" height="358" rx="14" fill="none" stroke="#CCFBF1" stroke-width="1.5"/>

  <g id="title-block">
    <rect x="64" y="62" width="12" height="12" fill="#B45309"/>
    <text class="mono" x="86" y="74" font-size="17" letter-spacing="2" fill="#5F6F6B">深度调研 · SKILL</text>
    <text class="sans" x="64" y="152" font-size="72" font-weight="700" fill="#134E4A">深度调研</text>
    <text class="sans" x="64" y="196" font-size="26" font-weight="700" fill="#0F766E">多源检索 → 结构化中文报告</text>
    <text class="sans" x="64" y="238" font-size="21" fill="#134E4A">先确认范围再开工，不直接罗列链接。</text>
  </g>

  <line x1="700" y1="56" x2="700" y2="256" stroke="#CCFBF1" stroke-width="1.5"/>

  <g id="proof">
    <text class="sans" x="740" y="74" font-size="17" fill="#5F6F6B">报告里有什么硬货</text>
    <text class="mono" x="740" y="118" font-size="20" font-weight="700" fill="#B45309">6 步</text>
    <text class="sans" x="791" y="118" font-size="22" font-weight="700" fill="#134E4A">检索 → 复刻方案</text>
    <text class="mono" x="740" y="164" font-size="20" font-weight="700" fill="#B45309">结构化</text>
    <text class="sans" x="814" y="164" font-size="22" font-weight="700" fill="#134E4A">中文调研报告</text>
    <text class="mono" x="740" y="210" font-size="20" font-weight="700" fill="#B45309">可核验</text>
    <text class="sans" x="814" y="210" font-size="22" font-weight="700" fill="#134E4A">每条保留来源 URL</text>
  </g>

  <line x1="64" y1="288" x2="1136" y2="288" stroke="#CCFBF1" stroke-width="1.5"/>
  <g id="install">
    <text class="mono" x="64" y="327" font-size="16" fill="#5F6F6B">安装</text>
    <text class="mono" x="140" y="327" font-size="20" font-weight="700" fill="#0F766E">npx skills add lhg-skills/lhg-deep-research</text>
  </g>
</svg>
